repos:
  - repo: local
    hooks:
      - id: format
        name: ruff format
        entry: uv run ruff format src/ tests/
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: lint
        name: ruff check
        entry: uv run ruff check src/ tests/ --fix
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: test
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
