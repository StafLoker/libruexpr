[project]
name = "libtexpr"
version = "0.1.0"
description = "Placeholder expression engine for templates: [FIELD + 1 | function: arg] in Cyrillic or Latin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "StafLoker", email = "dev.stafloker@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["template", "placeholder", "expression", "parser", "cyrillic", "latin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/StafLoker/libtexpr"
"Bug Tracker" = "https://github.com/StafLoker/libtexpr/issues"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501", "B008", "ARG002"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
